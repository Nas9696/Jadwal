<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>نظام جداول الاختبارات الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="sticky top-0 z-50 bg-white shadow-sm no-print border-b border-slate-200">
        <div class="max-w-5xl mx-auto flex">
            <button onclick="switchTab('header')" id="btn-header"
                class="tab-btn active flex-1 py-3 font-black text-sm flex items-center justify-center gap-1">
                <i data-lucide="landmark" class="w-4 h-4"></i> الترويسة
            </button>
            <button onclick="switchTab('table')" id="btn-table"
                class="tab-btn flex-1 py-3 font-black text-sm flex items-center justify-center gap-1">
                <i data-lucide="table-2" class="w-4 h-4"></i> الجدول والفصول
            </button>
            <button onclick="switchTab('preview')" id="btn-preview"
                class="tab-btn flex-1 py-3 font-black text-sm flex items-center justify-center gap-1">
                <i data-lucide="eye" class="w-4 h-4"></i> المعاينة
            </button>
        </div>
    </nav>

    <div class="main-wrapper">

        <!-- ========== TAB 1: الترويسة والإعدادات ========== -->
        <div id="header-tab" class="tab-content active no-print">
            <div class="panel control-panel rounded-xl p-5">
                <!-- أزرار سريعة -->
                <div class="flex flex-wrap gap-2 mb-5 pb-4 border-b border-slate-200">
                    <button onclick="saveState(true)" class="action-btn bg-emerald-700 text-white">
                        <i data-lucide="save" class="w-4 h-4"></i> حفظ
                    </button>
                    <button onclick="resetScheduleOnly()" class="action-btn bg-white text-slate-700 border border-slate-300">
                        <i data-lucide="eraser" class="w-4 h-4"></i> تفريغ الجدول
                    </button>
                    <button onclick="restoreDefaults()" class="action-btn bg-white text-red-700 border border-red-200">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i> استعادة
                    </button>
                    <button onclick="exportBackup()" class="action-btn bg-white text-blue-800 border border-blue-200">
                        <i data-lucide="download" class="w-4 h-4"></i> تصدير
                    </button>
                    <button onclick="byId('backup_file_input').click()" class="action-btn bg-white text-violet-800 border border-violet-200">
                        <i data-lucide="upload" class="w-4 h-4"></i> استيراد
                    </button>
                    <input type="file" id="backup_file_input" accept=".json" class="hidden">
                </div>

                <div class="settings-grid">
                    <!-- القسم الأيسر: الترويسة -->
                    <section class="settings-section">
                        <h3 class="section-title"><i data-lucide="landmark" class="w-5 h-5"></i> بيانات الترويسة</h3>

                        <div class="grid grid-cols-2 gap-2">
                            <div class="space-y-1">
                                <label class="compact-label">الشق الأيمن (١)</label>
                                <input type="text" id="h_r1" class="field">
                            </div>
                            <div class="space-y-1">
                                <label class="compact-label">الشق الأيسر (١)</label>
                                <input type="text" id="h_l1" class="field">
                            </div>
                            <div class="space-y-1">
                                <label class="compact-label">الشق الأيمن (٢)</label>
                                <input type="text" id="h_r2" class="field">
                            </div>
                            <div class="space-y-1">
                                <label class="compact-label">الشق الأيسر (٢)</label>
                                <input type="text" id="h_l2" class="field">
                            </div>
                            <div class="space-y-1">
                                <label class="compact-label">الشق الأيمن (٣)</label>
                                <input type="text" id="h_r3" class="field">
                            </div>
                            <div class="space-y-1">
                                <label class="compact-label">الشق الأيسر (٣)</label>
                                <input type="text" id="h_l3" class="field">
                            </div>
                        </div>

                        <div class="space-y-1 mt-3">
                            <label class="compact-label">اسم المدرسة</label>
                            <input type="text" id="school_name_input" class="field font-bold">
                        </div>

                        <div class="grid grid-cols-2 gap-2 mt-3">
                            <div class="compact-box form-cluster">
                                <label class="compact-label">محاذاة الأيمن</label>
                                <select id="header_right_align" class="field font-bold">
                                    <option value="right">يمين</option>
                                    <option value="center">وسط</option>
                                </select>
                                <label class="compact-label mt-1">حجم خط الأيمن</label>
                                <input type="number" id="header_right_size" min="8" max="22" class="field text-center font-bold">
                            </div>
                            <div class="compact-box form-cluster">
                                <label class="compact-label">محاذاة الأيسر</label>
                                <select id="header_left_align" class="field font-bold">
                                    <option value="left">يسار</option>
                                    <option value="center">وسط</option>
                                </select>
                                <label class="compact-label mt-1">حجم خط الأيسر</label>
                                <input type="number" id="header_left_size" min="8" max="22" class="field text-center font-bold">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2 mt-3 pt-3 border-t">
                            <div class="space-y-1">
                                <label class="compact-label">شعار (رابط صورة)</label>
                                <input type="url" id="logo_url_input" class="field" dir="ltr" placeholder="الصق رابط الشعار هنا...">
                            </div>
                            <div class="space-y-1">
                                <label class="compact-label">أو إرفاق من الجهاز</label>
                                <input type="file" id="logo_file_input" accept="image/*" class="field bg-white">
                            </div>
                        </div>

                        <div class="space-y-1 mt-3 pt-3 border-t">
                            <label class="compact-label">نوع الخط</label>
                            <select id="font_family" class="field font-bold">
                                <option value="Cairo">Cairo (القاهرة)</option>
                                <option value="Tajawal">Tajawal (تجول)</option>
                                <option value="Arial">أريال (Arial)</option>
                                <option value="Traditional Arabic">خط تقليدي (Traditional Arabic)</option>
                            </select>
                        </div>
                    </section>

                    <!-- القسم الأيمن: العنوان والمدير -->
                    <section class="settings-section">
                        <h3 class="section-title"><i data-lucide="heading" class="w-5 h-5"></i> العنوان والأسبوع</h3>

                        <div class="space-y-1">
                            <label class="compact-label">العنوان الرئيسي للجدول</label>
                            <input type="text" id="main_title_input" class="field font-black">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="space-y-1">
                                <label class="compact-label">حجم خط العنوان</label>
                                <input type="number" id="main_title_size" min="14" max="40" class="field text-center font-bold">
                            </div>
                        </div>

                        <div class="compact-box form-cluster bg-blue-50 border-blue-100 mt-3">
                            <label class="compact-label text-blue-800">رقم الأسبوع الأول</label>
                            <div class="flex gap-2">
                                <input type="text" id="week_number" class="field font-bold flex-1">
                                <select onchange="byId('week_number').value=this.value; byId('week_number').dispatchEvent(new Event('input'))" class="field w-20 text-xs">
                                    <option value="">سريع</option>
                                    <option value="الأسبوع الأول">١</option>
                                    <option value="الأسبوع الثاني">٢</option>
                                    <option value="الأسبوع الخامس">٥</option>
                                    <option value="الأسبوع العاشر">١٠</option>
                                    <option value="الأسبوع الرابع عشر">١٤</option>
                                    <option value="الأسبوع الخامس عشر">١٥</option>
                                </select>
                            </div>
                            <label class="flex items-center gap-2 mt-2 text-xs font-black cursor-pointer">
                                <input type="checkbox" id="show_week_box" class="accent-blue-700"> إظهار مربع الأسبوع
                            </label>
                        </div>

                        <!-- مدير المدرسة -->
                        <h3 class="section-title mt-4"><i data-lucide="user" class="w-5 h-5"></i> مدير المدرسة</h3>
                        <div class="space-y-1">
                            <label class="compact-label">اسم مدير المدرسة</label>
                            <input type="text" id="principal_input" class="field font-black">
                        </div>
                        <div class="space-y-1">
                            <label class="compact-label">حجم خط المدير</label>
                            <input type="number" id="principal_size" min="10" max="28" class="field text-center font-bold w-24">
                        </div>

                        <!-- الملاحظات -->
                        <h3 class="section-title mt-4"><i data-lucide="list-checks" class="w-5 h-5"></i> الملاحظات</h3>
                        <div class="flex items-center justify-between">
                            <span class="compact-label">التعليمات السفلية</span>
                            <button onclick="addInstruction()" class="action-btn bg-emerald-50 text-emerald-800 border border-emerald-100 text-xs">
                                <i data-lucide="plus" class="w-3 h-3"></i> إضافة
                            </button>
                        </div>
                        <div id="instructions_editor" class="space-y-2 mt-2"></div>

                        <!-- الطباعة والألوان -->
                        <h3 class="section-title mt-4"><i data-lucide="palette" class="w-5 h-5"></i> الطباعة والألوان</h3>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="space-y-1">
                                <label class="compact-label">اتجاه الطباعة</label>
                                <select id="print_orientation" class="field font-bold">
                                    <option value="landscape">أفقي</option>
                                    <option value="portrait">رأسي</option>
                                </select>
                            </div>
                            <div class="space-y-1">
                                <label class="compact-label">قالب الألوان</label>
                                <select id="table_theme" class="field font-bold">
                                    <option value="emerald">الزمردي</option>
                                    <option value="purple">الأرجواني (الوزاري)</option>
                                    <option value="ocean">المحيط</option>
                                </select>
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-2 mt-2">
                            <label class="flex items-center gap-1 text-[11px] font-black cursor-pointer compact-box">
                                <input type="checkbox" id="use_arabic_numerals" class="accent-emerald-700"> أرقام عربية
                            </label>
                            <label class="flex items-center gap-1 text-[11px] font-black cursor-pointer compact-box">
                                <input type="checkbox" id="use_class_colors" class="accent-emerald-700"> تلوين الأعمدة
                            </label>
                            <label class="flex items-center gap-1 text-[11px] font-black cursor-pointer compact-box">
                                <input type="checkbox" id="use_row_colors" class="accent-emerald-700"> تلوين الصفوف
                            </label>
                            <label class="flex items-center gap-1 text-[11px] font-black cursor-pointer compact-box">
                                <input type="checkbox" id="use_material_colors" class="accent-emerald-700"> تلوين المواد
                            </label>
                        </div>
                    </section>
                </div>
            </div>
        </div>

        <!-- ========== TAB 2: الجدول والفصول ========== -->
        <div id="table-tab" class="tab-content no-print">
            <div class="panel control-panel rounded-xl p-5">
                <div class="settings-grid">
                    <section class="settings-section">
                        <h3 class="section-title"><i data-lucide="school" class="w-5 h-5"></i> المرحلة والقالب</h3>

                        <div class="space-y-1">
                            <label class="compact-label">المرحلة الدراسية</label>
                            <select id="stageSelect" class="field font-black bg-emerald-50">
                                <option value="early_childhood">الطفولة المبكرة (أول-ثاني-ثالث)</option>
                                <option value="elementary">الابتدائية (رابع-خامس-سادس)</option>
                                <option value="intermediate">المتوسطة (أول-ثاني-ثالث)</option>
                                <option value="secondary">الثانوية</option>
                            </select>
                        </div>

                        <div class="space-y-1">
                            <label class="compact-label">نوع القالب</label>
                            <select id="table_mode" class="field font-black">
                                <option value="ministerial">وزاري (أسبوعين منفصلين)</option>
                                <option value="traditional">تقليدي (جدول واحد شامل)</option>
                            </select>
                        </div>

                        <!-- الأسبوع الأول -->
                        <div class="compact-box form-cluster bg-emerald-50 border-emerald-100 mt-3">
                            <p class="text-xs font-black text-emerald-900 mb-2">📅 الأسبوع الأول</p>
                            <div class="grid grid-cols-3 gap-2">
                                <div class="space-y-1">
                                    <label class="compact-label">عدد الأيام</label>
                                    <input type="number" id="days_count" min="1" max="10" class="field text-center font-bold">
                                </div>
                                <div class="space-y-1">
                                    <label class="compact-label">يوم البداية</label>
                                    <input type="number" id="start_day" min="1" max="30" class="field text-center font-bold">
                                </div>
                                <div class="space-y-1">
                                    <label class="compact-label">الشهر</label>
                                    <input type="number" id="start_month" min="1" max="12" class="field text-center font-bold">
                                </div>
                            </div>
                            <div class="space-y-1 mt-2">
                                <label class="compact-label">بداية من يوم</label>
                                <select id="start_day_name" class="field font-bold">
                                    <option value="الأحد">الأحد</option>
                                    <option value="الاثنين">الاثنين</option>
                                    <option value="الثلاثاء">الثلاثاء</option>
                                    <option value="الأربعاء">الأربعاء</option>
                                    <option value="الخميس">الخميس</option>
                                </select>
                            </div>
                        </div>

                        <!-- الأسبوع الثاني -->
                        <div class="compact-box form-cluster bg-violet-50 border-violet-100 mt-3">
                            <label class="flex items-center gap-2 text-xs font-black text-violet-900 mb-2 cursor-pointer">
                                <input type="checkbox" id="week2_enabled" class="accent-violet-700">
                                📅 تفعيل الأسبوع الثاني
                            </label>
                            <div id="week2_settings" class="hidden">
                                <div class="space-y-1 mb-2">
                                    <label class="compact-label">رقم الأسبوع الثاني</label>
                                    <input type="text" id="week2_number" class="field font-bold" value="الأسبوع الخامس عشر">
                                </div>
                                <div class="grid grid-cols-3 gap-2">
                                    <div class="space-y-1">
                                        <label class="compact-label">عدد الأيام</label>
                                        <input type="number" id="week2_days_count" min="1" max="10" class="field text-center font-bold">
                                    </div>
                                    <div class="space-y-1">
                                        <label class="compact-label">يوم البداية</label>
                                        <input type="number" id="week2_start_day" min="1" max="30" class="field text-center font-bold">
                                    </div>
                                    <div class="space-y-1">
                                        <label class="compact-label">الشهر</label>
                                        <input type="number" id="week2_start_month" min="1" max="12" class="field text-center font-bold">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="settings-section">
                        <h3 class="section-title"><i data-lucide="columns" class="w-5 h-5"></i> الفصول (للقالب التقليدي)</h3>

                        <div class="space-y-1">
                            <label class="compact-label">قالب الفصول</label>
                            <select id="class_template_select" class="field font-bold bg-slate-50"></select>
                        </div>

                        <div class="flex gap-2 mt-2">
                            <input type="text" id="new_class_name" class="field flex-1" placeholder="أضف فصل جديد...">
                            <button onclick="addClassColumn()" class="action-btn bg-emerald-700 text-white">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>

                        <div id="class_names_editor" class="grid grid-cols-2 gap-2 mt-2"></div>

                        <!-- بنك المواد -->
                        <h3 class="section-title mt-4"><i data-lucide="book-open" class="w-5 h-5"></i> بنك المواد</h3>
                        <div class="flex gap-2 mb-2">
                            <input type="text" id="new_material" class="field flex-1" placeholder="أضف مادة جديدة...">
                            <button onclick="addMaterial()" class="action-btn bg-emerald-700 text-white">إضافة</button>
                        </div>
                        <div id="materials_tags" class="flex flex-wrap gap-2"></div>

                        <!-- ألوان الصفوف -->
                        <div class="mt-4">
                            <label class="compact-label mb-2 block">ألوان أيام الجدول</label>
                            <div id="row_colors_editor" class="grid grid-cols-2 gap-2"></div>
                        </div>
                    </section>
                </div>
            </div>
        </div>

        <!-- ========== TAB 3: المعاينة ========== -->
        <div id="preview-tab" class="tab-content">
            <div id="printArea" class="print-container">
                <!-- الترويسة -->
                <div class="flex justify-between items-start mb-4 px-8 pt-6">
                    <div id="header_right" class="w-2/5 text-right font-bold leading-relaxed"></div>
                    <div class="flex flex-col items-center">
                        <img id="logoImg" class="h-32 max-w-[200px] object-contain" alt="شعار" crossorigin="anonymous">
                    </div>
                    <div id="header_left" class="w-2/5 text-left font-bold leading-relaxed"></div>
                </div>

                <!-- العنوان الرئيسي -->
                <div class="text-center mb-4 px-8">
                    <div class="inline-block bg-yellow-200 border-b-4 border-emerald-600 px-8 py-2">
                        <h1 id="main_title_display" class="font-black text-xl text-emerald-900"></h1>
                    </div>
                </div>

                <!-- منطقة الجداول -->
                <div id="tables_container" class="px-8"></div>

                <!-- التذييل -->
                <div class="grid grid-cols-2 gap-10 mt-10 px-8 pb-6">
                    <div>
                        <h4 class="font-black text-slate-800 border-b-2 border-emerald-500 w-fit pb-1 text-sm mb-3">تعليمات هامة:</h4>
                        <ul id="instructions_display" class="text-[11px] space-y-1.5 font-bold text-slate-700 list-none"></ul>
                    </div>
                    <div class="text-center space-y-8">
                        <div>
                            <p class="font-black text-slate-900 text-sm">مدير المدرسة</p>
                            <p id="principal_display" class="font-black text-emerald-900 text-sm border-b-2 border-dotted border-emerald-200 pb-1 w-4/5 mx-auto mt-1"></p>
                        </div>
                        <div class="w-24 h-14 border-2 border-dashed border-emerald-100 rounded-lg mx-auto flex items-center justify-center text-[9px] text-slate-300 italic">ختم المدرسة</div>
                    </div>
                </div>
            </div>

            <!-- أزرار المعاينة -->
            <div class="flex flex-wrap justify-center gap-3 mt-6 no-print pb-20">
                <button onclick="switchTab('header')" class="action-btn bg-white text-slate-700 border border-slate-300 px-6 py-3">
                    <i data-lucide="settings" class="w-4 h-4"></i> الترويسة
                </button>
                <button onclick="switchTab('table')" class="action-btn bg-white text-blue-700 border border-blue-300 px-6 py-3">
                    <i data-lucide="table-2" class="w-4 h-4"></i> الجدول
                </button>
                <button onclick="shareWhatsApp()" class="action-btn bg-green-600 text-white px-6 py-3">
                    <i data-lucide="send" class="w-4 h-4"></i> واتساب
                </button>
                <button onclick="printOrExportPDF()" class="action-btn bg-emerald-700 text-white px-10 py-3">
                    <i data-lucide="printer" class="w-4 h-4"></i> طباعة / PDF
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
</body>
</html>
