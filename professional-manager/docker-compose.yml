services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-professional_manager}
      POSTGRES_USER: ${POSTGRES_USER:-professional_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-professional_manager}
    ports: ["5432:5432"]
    volumes: ["professional_manager_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://professional_manager:professional_manager@postgres:5432/professional_manager}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
    command: sh -c "alembic upgrade head && python -m app.seed && python -m app.demo_seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      API_INTERNAL_URL: http://api:8000/api/v1
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  professional_manager_data:
