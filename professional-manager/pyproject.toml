[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "scheduler/tests"]
pythonpath = ["apps/api", "scheduler"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
