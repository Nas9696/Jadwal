name: Professional Manager CI

on:
  push:
    paths: ["professional-manager/**", ".github/workflows/professional-manager-ci.yml"]
  pull_request:
    paths: ["professional-manager/**", ".github/workflows/professional-manager-ci.yml"]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: professional-manager}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: professional-manager/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:web
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: professional_manager_ci
          POSTGRES_USER: professional_manager
          POSTGRES_PASSWORD: professional_manager_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U professional_manager -d professional_manager_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://professional_manager:professional_manager_ci@localhost:5432/professional_manager_ci
      PYTHONPATH: apps/api
    defaults: {run: {working-directory: professional-manager}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: professional-manager/apps/api/requirements-dev.txt}
      - run: pip install -r apps/api/requirements-dev.txt
      - run: pip install -e scheduler
      - name: Wait for PostgreSQL
        run: until pg_isready -h localhost -p 5432 -U professional_manager -d professional_manager_ci; do sleep 2; done
      - name: Migrate empty PostgreSQL database through Alembic 0001 to 0008
        run: alembic -c apps/api/alembic.ini upgrade head
      - name: Seed PostgreSQL with foreign keys enforced
        run: python -m app.seed
      - name: Assert seeded PostgreSQL integrity
        run: python -c "from sqlalchemy import create_engine,text; from app.config import settings; e=create_engine(settings.database_url); c=e.connect(); assert c.scalar(text('select count(*) from tenants')) >= 1; assert c.scalar(text('select count(*) from schools')) >= 1; assert c.scalar(text('select count(*) from terms')) >= 1; assert c.scalar(text('select count(*) from alembic_version where version_num = :v'), {'v':'0008_pm003c_editor'}) == 1; assert c.scalar(text(\"select count(*) from information_schema.tables where table_name = 'working_timetables'\")) == 1; assert c.scalar(text(\"select count(*) from information_schema.tables where table_name = 'timetable_edit_changes'\")) == 1; c.close()"
      - run: ruff check apps/api scheduler
      - run: mypy apps/api/app scheduler/pm_scheduler
      - run: pytest
